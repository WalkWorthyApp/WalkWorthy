name: Firebase Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - firebase-migration

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Firebase Functions dependencies
        run: npm ci
        working-directory: functions

      - name: Lint functions
        run: npm run lint --if-present
        working-directory: functions

      - name: Use Java for the Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.29.0

      - name: Build and test functions with Firestore
        run: firebase emulators:exec --only firestore --project demo-walkworthy-compliance "npm --prefix functions run test:ci"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Activate Service Account
        run: |
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
          gcloud config set project walkworthy-app

      - name: Deploy to Firebase
        run: |
          firebase deploy --only functions,firestore:rules,firestore:indexes,hosting --project walkworthy-app
