name: Firebase Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - firebase-migration

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/backend-checks.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # The functions predeploy hook (firebase.json) runs the TypeScript build.
      - name: Install Firebase Functions dependencies
        run: npm ci
        working-directory: functions

      - name: Install Firebase CLI
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: .github/ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Activate Service Account
        run: |
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
          gcloud config set project walkworthy-app

      - name: Deploy to Firebase
        run: |
          .github/ci/node_modules/.bin/firebase deploy --only functions,firestore:rules,firestore:indexes,hosting --project walkworthy-app
