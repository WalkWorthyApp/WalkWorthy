name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Fetch pinned code review plugin
        env:
          PLUGIN_COMMIT: 71cdddec623889d38af14b7a489670a03186f659
        run: |
          plugin_repo="$RUNNER_TEMP/walkworthy-code-review"
          git init --quiet "$plugin_repo"
          git -C "$plugin_repo" fetch --quiet --depth=1 https://github.com/anthropics/claude-code.git "$PLUGIN_COMMIT"
          git -C "$plugin_repo" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$plugin_repo" rev-parse HEAD)" = "$PLUGIN_COMMIT"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@6fed3ca145920b639991cb756090506e1bcaf515 # v1.0.245
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--plugin-dir "${{ runner.temp }}/walkworthy-code-review/plugins/code-review"'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

